buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 34
        ndkVersion = "27.0.12077973"
        kotlinVersion = "1.9.24"
        REACT_NATIVE_NODE_MODULES_DIR = "$rootDir/../node_modules/react-native"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"

subprojects {
    def configureProject = { proj ->
        if (proj.plugins.hasPlugin("com.android.application") || proj.plugins.hasPlugin("com.android.library")) {
            proj.android {
                compileSdk = 36
                ndkVersion = "27.0.12077973"
                defaultConfig {
                    ndk {
                        abiFilters "arm64-v8a"
                    }
                    externalNativeBuild {
                        cmake {
                            def currentArgs = arguments ?: []
                            if (!currentArgs.contains("-DANDROID_STL=c++_shared")) {
                                arguments = currentArgs + ["-DANDROID_STL=c++_shared"]
                            }
                        }
                    }
                }
                buildTypes.all { buildType ->
                    if (buildType.externalNativeBuild.cmake != null) {
                        def currentArgs = buildType.externalNativeBuild.cmake.arguments ?: []
                        if (!currentArgs.contains("-DANDROID_STL=c++_shared")) {
                            buildType.externalNativeBuild.cmake.arguments = currentArgs + ["-DANDROID_STL=c++_shared"]
                        }
                    }
                }
            }
            proj.android.buildTypes.all { buildType ->
                println "PROJECT: ${proj.name}, BUILDTYPE: ${buildType.name}, CMAKE ARGS: ${buildType.externalNativeBuild.cmake?.arguments}"
            }
        }
    }
    if (project.state.executed) {
        configureProject(project)
    } else {
        project.afterEvaluate {
            configureProject(project)
        }
    }
}

allprojects {
    // Redirect JCenter (permanently shut down) to Maven Central for all subprojects
    repositories {
        google()
        mavenCentral()
        maven { url "https://maven.google.com" }
        maven {
            // JCenter mirror — resolves legacy artifacts (e.g. react-native-community/geolocation build tools)
            url "https://jcenter.bintray.com"
            content {
                // Only fetch from JCenter what cannot be found on Maven Central
            }
        }
    }
    configurations.all {
        resolutionStrategy {
            force "com.google.android.gms:play-services-location:20.0.0"
            // Force modern Android build tools to avoid old JCenter-only plugin versions
            force "com.android.tools.build:gradle:8.3.2"
        }
    }
}
